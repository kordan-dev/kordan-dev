name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=#FF6B6B&color_dots=#ebedf0,#FFE0B2,#FFB347,#FF8E53,#FF6B6B
            dist/snake-dark.svg?palette=github-dark&color_snake=#2EC4B6&color_background=#10141F&color_dots=#1b2130,#4a3a24,#8a5a2b,#d9822b,#FFB347

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
